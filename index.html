<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NFC Terminál V2</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --panel2: #151515;
    --blue: #0af;
    --blue2: #06c;
    --text: #fff;
    --muted: #bbb;
    --green: #2ecc71;
    --red: #ff6b6b;
    --border: rgba(0,170,255,0.15);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
  }

  body { padding: 8px; }

  .app {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  h1 {
    margin: 0;
    color: var(--blue);
    text-align: center;
    font-size: 24px;
    line-height: 1.1;
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .topcard {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    min-width: 0;
  }
  .topcard .label { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  .topcard .value {
    font-size: 18px;
    font-weight: 800;
    color: var(--blue);
    line-height: 1.1;
    word-break: break-all;
  }
  .topcard .value.small { font-size: 12px; }

  #status {
    padding: 8px 10px;
    border-radius: 12px;
    background: #000;
    border: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.3;
    color: var(--blue);
    min-height: 38px;
  }
  #status.info { color: var(--blue); }
  #status.success { color: var(--green); }
  #status.error { color: var(--red); }

  button {
    font-family: inherit;
    border: none;
    border-radius: 12px;
    background: var(--blue);
    color: #000;
    font-size: 15px;
    font-weight: 800;
    min-height: 46px;
    cursor: pointer;
    transition: background .12s, transform .08s;
  }
  button:active { background: var(--blue2); transform: scale(0.98); }
  button[disabled] { opacity: .5; cursor: not-allowed; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
  }

  .field { margin-bottom: 8px; min-width: 0; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; color: #aaa; margin-bottom: 3px; font-size: 11px; }

  .field input, .field select {
    width: 100%;
    font-size: 17px;
    border: 2px solid var(--blue);
    border-radius: 12px;
    padding: 8px 10px;
    background: #000;
    color: var(--blue);
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    min-height: 44px;
  }

  .priceBox {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 13px;
    color: #ddd;
    margin-bottom: 8px;
  }
  .priceBox strong { color: var(--green); font-size: 20px; }

  .hidden { display: none !important; }

  /* Celoobrazovkové ověření */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay.ok { background: #0b7a3b; }
  #overlay.bad { background: #b3261e; }
  #overlay.none { background: #444; }
  #ovIcon { font-size: 90px; line-height: 1; }
  #ovTitle { font-size: 34px; font-weight: 800; }
  #ovTicket { font-size: 24px; font-weight: 700; }
  #ovZones { font-size: 52px; font-weight: 800; }
  #ovValid { font-size: 18px; opacity: .95; }
  #ovClose {
    margin-top: 18px;
    width: 100%;
    max-width: 320px;
    min-height: 58px;
    font-size: 20px;
    background: #fff;
    color: #000;
  }
</style>
</head>
<body>
<div class="app">
  <h1>NFC Terminál V2</h1>

  <div class="row2">
    <div class="topcard"><div class="label">Zůstatek</div><div class="value" id="balance">?</div></div>
    <div class="topcard"><div class="label">UID</div><div class="value small" id="viewUid">-</div></div>
  </div>

  <div id="status" class="info">Stiskněte „Zapnout NFC“.</div>

  <div class="row2">
    <button id="startNFC">Zapnout NFC</button>
    <button onclick="startTopUp()">Dobít</button>
    <button onclick="startPurchase()">Koupit</button>
    <button onclick="startVerify()">Ověřit</button>
  </div>

  <div class="card">
    <div class="field">
      <label for="ticketType">Typ jízdenky</label>
      <select id="ticketType" onchange="onTicketTypeChange()">
        <option value="4">Pásmová jízdenka PID</option>
        <option value="1">Jednorázová jízdenka</option>
        <option value="2">Celodenní jízdenka</option>
        <option value="3">Studentská jízdenka</option>
        <option value="5">Vlastní cena</option>
      </select>
    </div>

    <div id="zoneBlock" class="row2">
      <div class="field">
        <label for="zoneCount">Počet pásem</label>
        <select id="zoneCount" onchange="updatePrice()"></select>
      </div>
      <div class="field">
        <label for="zonePrice">Cena pásma (Kč)</label>
        <input id="zonePrice" type="text" inputmode="numeric" pattern="[0-9]*" value="12" oninput="digitsOnly(this); updatePrice()" />
      </div>
    </div>

    <div id="customPriceBlock" class="field hidden">
      <label for="customPriceInput">Vlastní cena jízdenky (Kč)</label>
      <input id="customPriceInput" type="text" inputmode="numeric" pattern="[0-9]*" value="25" oninput="digitsOnly(this); updatePrice()" />
    </div>

    <div class="row2">
      <div class="field">
        <label for="ticketValidity">Platnost (min)</label>
        <input id="ticketValidity" type="text" inputmode="numeric" pattern="[0-9]*" value="60" oninput="digitsOnly(this)" />
      </div>
      <div class="field">
        <label for="amountInput">Částka k dobití (Kč)</label>
        <input id="amountInput" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" oninput="digitsOnly(this)" />
      </div>
    </div>

    <div class="priceBox" style="margin-top:8px; margin-bottom:0;">
      Cena jízdenky: <strong id="ticketPrice">0 Kč</strong>
      <span id="priceDetail" style="margin-left:6px;"></span>
    </div>
  </div>
</div>

<div id="overlay" class="none">
  <div id="ovIcon"></div>
  <div id="ovTitle"></div>
  <div id="ovTicket"></div>
  <div id="ovZones"></div>
  <div id="ovValid"></div>
  <button id="ovClose" onclick="closeOverlay()">Zavřít</button>
</div>

<script>
const SECRET_KEY = "demo123";
const MIME_TYPE = "application/x-nfc-terminal";
const FORMAT_VERSION = 1;
const MAX_ZONES = 13;
const FIXED_PRICES = { 1: 25, 2: 80, 3: 15 };
const TICKET_NAMES = { 0: "Žádná", 1: "Jednorázová jízdenka", 2: "Celodenní jízdenka", 3: "Studentská jízdenka", 4: "Pásmová jízdenka PID", 5: "Jízdenka (vlastní cena)" };

let ndef = null;
let pendingAction = null;
let amount = 0;
let busy = false;
let card = emptyCard();
let cardLoaded = false;
let cardUid = "-";

function emptyCard() {
  return { balance: 0, ticketType: 0, zones: 0, validUntilMin: 0, lastKind: 0, lastAmount: 0, lastTicketType: 0, lastZones: 0, lastTimeMin: 0 };
}
function nowMin() { return Math.floor(Date.now() / 60000); }
function minToStr(min) { return min ? new Date(min * 60000).toLocaleString("cs-CZ") : "-"; }
function digitsOnly(el) { el.value = el.value.replace(/\D+/g, ""); }
function numVal(id) { return parseInt(document.getElementById(id).value, 10) || 0; }

function setStatus(msg, type = "info") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = type;
}

/* ---------- Kódování (24 bajtů) ---------- */
function checksum(bytes) {
  let h = 0x811c9dc5;
  const key = new TextEncoder().encode(SECRET_KEY);
  for (let i = 0; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  for (let i = 0; i < key.length; i++) { h ^= key[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function xorBytes(data) {
  const key = new TextEncoder().encode(SECRET_KEY);
  const out = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) out[i] = data[i] ^ key[i % key.length];
  return out;
}
function encodeCard(c) {
  const buf = new Uint8Array(24);
  const dv = new DataView(buf.buffer);
  dv.setUint8(0, FORMAT_VERSION);
  dv.setUint32(1, c.balance);
  dv.setUint8(5, c.ticketType);
  dv.setUint8(6, c.zones);
  dv.setUint32(7, c.validUntilMin);
  dv.setUint8(11, c.lastKind);
  dv.setUint16(12, c.lastAmount);
  dv.setUint8(14, c.lastTicketType);
  dv.setUint8(15, c.lastZones);
  dv.setUint32(16, c.lastTimeMin);
  dv.setUint32(20, checksum(buf.slice(0, 20)));
  return xorBytes(buf);
}
function decodeCard(bytes) {
  if (bytes.length !== 24) return null;
  const plain = xorBytes(bytes);
  const dv = new DataView(plain.buffer);
  if (dv.getUint8(0) !== FORMAT_VERSION) return null;
  if (dv.getUint32(20) !== checksum(plain.slice(0, 20))) return null;
  return {
    balance: dv.getUint32(1), ticketType: dv.getUint8(5), zones: dv.getUint8(6),
    validUntilMin: dv.getUint32(7), lastKind: dv.getUint8(11), lastAmount: dv.getUint16(12),
    lastTicketType: dv.getUint8(14), lastZones: dv.getUint8(15), lastTimeMin: dv.getUint32(16)
  };
}

/* ---------- UI ---------- */
function initZoneSelect() {
  const sel = document.getElementById("zoneCount");
  for (let i = 1; i <= MAX_ZONES; i++) {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = i + (i === 1 ? " pásmo" : i < 5 ? " pásma" : " pásem");
    sel.appendChild(o);
  }
  sel.value = "3";
}
function getTicketPrice() {
  const type = parseInt(document.getElementById("ticketType").value, 10);
  if (type === 4) {
    const zones = numVal("zoneCount");
    const perZone = numVal("zonePrice");
    return { type, zones, price: zones * perZone, perZone };
  }
  if (type === 5) return { type, zones: 0, price: numVal("customPriceInput"), perZone: 0 };
  return { type, zones: 0, price: FIXED_PRICES[type] || 0, perZone: 0 };
}
function onTicketTypeChange() {
  const t = parseInt(document.getElementById("ticketType").value, 10);
  document.getElementById("zoneBlock").classList.toggle("hidden", t !== 4);
  document.getElementById("customPriceBlock").classList.toggle("hidden", t !== 5);
  updatePrice();
}
function updatePrice() {
  const t = getTicketPrice();
  document.getElementById("ticketPrice").textContent = t.price + " Kč";
  document.getElementById("priceDetail").textContent = t.type === 4 ? `(${t.zones} × ${t.perZone} Kč)` : "";
}
function refreshTop() {
  document.getElementById("balance").textContent = cardLoaded ? card.balance + " Kč" : "?";
  document.getElementById("viewUid").textContent = cardUid;
}

/* ---------- Celoobrazovkové ověření ---------- */
function showOverlay(kind, icon, title, ticket, zones, valid) {
  const ov = document.getElementById("overlay");
  ov.className = "show " + kind;
  document.getElementById("ovIcon").textContent = icon;
  document.getElementById("ovTitle").textContent = title;
  document.getElementById("ovTicket").textContent = ticket;
  document.getElementById("ovZones").textContent = zones;
  document.getElementById("ovValid").textContent = valid;
}
function closeOverlay() {
  document.getElementById("overlay").className = "none";
  setStatus("Připraveno.", "info");
}

/* ---------- NFC ---------- */
async function initNFC() {
  if (!("NDEFReader" in window)) { setStatus("NFC není v tomto prohlížeči podporováno (použijte Chrome na Androidu přes HTTPS).", "error"); return; }
  try {
    ndef = new NDEFReader();
    await ndef.scan();
    document.getElementById("startNFC").disabled = true;
    setStatus("NFC aktivní — vyberte akci a přiložte kartu.", "info");
    ndef.onreading = (e) => handleReading(e);
    ndef.onreadingerror = () => setStatus("Chyba čtení NFC.", "error");
  } catch (err) {
    setStatus("NFC zamítnuto nebo chyba: " + err, "error");
  }
}
async function writeCard() {
  if (!ndef) throw new Error("NFC není zapnuté");
  await ndef.write({ records: [{ recordType: "mime", mediaType: MIME_TYPE, data: encodeCard(card) }] });
}
async function handleReading(event) {
  if (busy) return;
  busy = true;
  try {
    cardUid = event.serialNumber || "-";
    let decoded = null;
    for (const record of event.message.records) {
      if (record.recordType === "mime" && record.mediaType === MIME_TYPE) {
        const bytes = new Uint8Array(record.data.buffer, record.data.byteOffset, record.data.byteLength);
        decoded = decodeCard(bytes);
      }
    }
    if (decoded) {
      card = decoded;
    } else {
      card = emptyCard();
      card.lastKind = 3;
      card.lastTimeMin = nowMin();
      await writeCard();
    }
    cardLoaded = true;
    refreshTop();
    if (pendingAction) await runPendingAction();
    else setStatus("Karta načtena.", "success");
  } catch (e) {
    setStatus("Chyba: " + e, "error");
  } finally {
    busy = false;
  }
}

async function runPendingAction() {
  const action = pendingAction;
  pendingAction = null;

  if (action === "topup") {
    card.balance += amount;
    card.lastKind = 1;
    card.lastAmount = amount;
    card.lastTicketType = 0;
    card.lastZones = 0;
    card.lastTimeMin = nowMin();
    await writeCard();
    setStatus(`Dobito ${amount} Kč. Nový kredit: ${card.balance} Kč.`, "success");
    document.getElementById("amountInput").value = "";
  }

  if (action === "buyTicket") {
    const t = getTicketPrice();
    const validity = numVal("ticketValidity");
    if (!validity) { setStatus("Zadejte platnost jízdenky.", "error"); return; }
    if (t.price <= 0) { setStatus("Neplatná cena jízdenky.", "error"); return; }
    if (t.price > 65535) { setStatus("Cena je příliš vysoká (max 65 535 Kč).", "error"); return; }
    if (card.balance < t.price) {
      setStatus(`Nedostatek kreditu (${card.balance} Kč, cena ${t.price} Kč).`, "error");
      return;
    }
    card.balance -= t.price;
    card.ticketType = t.type;
    card.zones = t.zones;
    card.validUntilMin = nowMin() + validity;
    card.lastKind = 2;
    card.lastAmount = t.price;
    card.lastTicketType = t.type;
    card.lastZones = t.zones;
    card.lastTimeMin = nowMin();
    await writeCard();
    setStatus(`Prodáno: ${TICKET_NAMES[t.type]}${t.zones ? " (" + t.zones + " p.)" : ""} za ${t.price} Kč.`, "success");
  }

  if (action === "verify") {
    if (!card.ticketType) {
      showOverlay("none", "✖", "Žádná jízdenka", "Na kartě není jízdenka", "", "");
    } else {
      const valid = card.validUntilMin * 60000 > Date.now();
      const zones = card.zones ? card.zones + (card.zones === 1 ? " pásmo" : card.zones < 5 ? " pásma" : " pásem") : "";
      if (valid) {
        showOverlay("ok", "✔", "PLATNÁ", TICKET_NAMES[card.ticketType], zones, "Platí do " + minToStr(card.validUntilMin));
      } else {
        showOverlay("bad", "✖", "NEPLATNÁ", TICKET_NAMES[card.ticketType], zones, "Vypršela " + minToStr(card.validUntilMin));
      }
    }
  }

  refreshTop();
}

function startTopUp() {
  const v = numVal("amountInput");
  if (!v) { setStatus("Zadejte částku pro dobití.", "error"); return; }
  if (v > 65535) { setStatus("Maximální jednorázové dobití je 65 535 Kč.", "error"); return; }
  pendingAction = "topup";
  amount = v;
  setStatus(`Přiložte kartu — dobití ${v} Kč.`, "info");
}
function startPurchase() {
  const t = getTicketPrice();
  pendingAction = "buyTicket";
  setStatus(`Přiložte kartu — nákup za ${t.price} Kč.`, "info");
}
function startVerify() {
  pendingAction = "verify";
  setStatus("Přiložte kartu k ověření jízdenky.", "info");
}

document.getElementById("startNFC").addEventListener("click", initNFC);
initZoneSelect();
onTicketTypeChange();
refreshTop();
</script>
</body>
</html>
