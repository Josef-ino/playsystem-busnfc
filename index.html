<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NFC Terminál V2</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --panel2: #151515;
    --blue: #0af;
    --blue2: #06c;
    --text: #fff;
    --muted: #bbb;
    --green: #2ecc71;
    --red: #ff6b6b;
    --border: rgba(0,170,255,0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
  }

  body { padding: 6px; }

  .app {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  h1 {
    margin: 0;
    color: var(--blue);
    text-align: center;
    font-size: clamp(20px, 4.5vw, 32px);
    line-height: 1;
  }

  .subtitle {
    margin: 0;
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.15;
  }

  .topbar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    flex: 0 0 auto;
  }

  .topcard {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 7px 8px;
    box-shadow: 0 0 12px rgba(0,170,255,0.08);
    min-width: 0;
  }
  .topcard .label { font-size: 9px; color: var(--muted); margin-bottom: 3px; }
  .topcard .value {
    font-size: clamp(12px, 2.7vw, 20px);
    font-weight: 800;
    color: var(--blue);
    line-height: 1.05;
    word-break: break-word;
  }

  .topactions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    flex: 0 0 auto;
  }

  .main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 0.95fr 1.05fr;
    gap: 6px;
  }

  .card {
    background: var(--panel);
    border-radius: 14px;
    padding: 8px;
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 0 14px rgba(0,170,255,0.08);
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .section-title { font-size: 13px; margin: 0 0 5px; color: #fff; flex: 0 0 auto; }

  .field { margin-bottom: 6px; }
  .field label { display: block; color: #aaa; margin-bottom: 3px; font-size: 9px; }

  .field input, .field select {
    width: 100%;
    font-size: 13px;
    border: 2px solid var(--blue);
    border-radius: 11px;
    padding: 8px 9px;
    background: #000;
    color: var(--blue);
    outline: none;
    appearance: none;
    min-height: 38px;
  }

  .compact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .priceBox {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 7px 9px;
    margin-bottom: 6px;
    font-size: 11px;
    line-height: 1.3;
    color: #ddd;
  }
  .priceBox strong { color: var(--green); font-size: 15px; }

  .amountWrap {
    display: grid;
    grid-template-columns: 1fr 0.28fr;
    gap: 6px;
    margin-bottom: 6px;
  }

  #amountInput, #customPriceInput {
    width: 100%;
    padding: 9px 9px;
    font-size: 21px;
    text-align: center;
    color: var(--blue);
    background: #000;
    border: 2px solid var(--blue);
    border-radius: 11px;
    outline: none;
  }

  .amountBtn {
    border: none;
    border-radius: 11px;
    background: var(--panel2);
    color: var(--blue);
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid var(--border);
  }

  button.action, #startNFC {
    min-height: 40px;
    border: none;
    border-radius: 11px;
    font-weight: 800;
    cursor: pointer;
    transition: background .12s, transform .08s;
    background: var(--blue);
    color: #000;
    font-size: 12px;
    padding: 9px 7px;
    box-shadow: 0 0 9px rgba(0,170,255,0.12);
  }

  button.action:active, #startNFC:active, .amountBtn:active {
    background: var(--blue2);
    transform: scale(0.98);
  }

  #startNFC[disabled] { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  #status {
    margin-top: 6px;
    min-height: 38px;
    padding: 7px 9px;
    border-radius: 11px;
    background: #000;
    border: 1px solid var(--border);
    font-size: 11px;
    line-height: 1.3;
    color: var(--muted);
  }
  #status.info { color: var(--blue); }
  #status.success { color: var(--green); }
  #status.error { color: var(--red); }

  .rightGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    min-height: 0;
    flex: 1 1 auto;
  }

  .mini-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .mini-card h3 { margin: 0 0 5px; color: var(--blue); font-size: 12px; flex: 0 0 auto; }

  #log {
    margin-top: 6px;
    flex: 1 1 auto;
    min-height: 0;
    background: #000;
    border-radius: 11px;
    padding: 7px;
    color: #cfcfcf;
    white-space: pre-wrap;
    font-size: 10px;
    line-height: 1.25;
    border: 1px solid var(--border);
    overflow: auto;
  }

  .hidden { display: none; }

  @media (max-width: 980px) {
    .topbar { grid-template-columns: 1fr 1fr 1fr; }
    .topactions { grid-template-columns: repeat(2, 1fr); }
    .main { grid-template-columns: 1fr; }
    .rightGrid { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 560px) {
    body { padding: 4px; }
    .topbar { grid-template-columns: 1fr; }
    .topactions { grid-template-columns: 1fr 1fr; }
    .rightGrid { grid-template-columns: 1fr; }
    .compact-grid { grid-template-columns: 1fr; }
    .section-title { font-size: 12px; }
    .field { margin-bottom: 5px; }
    .field input, .field select { font-size: 12px; min-height: 36px; padding: 7px 8px; }
    button.action, #startNFC, .amountBtn { min-height: 38px; }
    .amountWrap { grid-template-columns: 1fr 0.28fr; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>NFC Terminál V2</h1>
  <div class="subtitle">Dobití kreditu, prodej jízdenek, pásmové PID jízdenky a ověření platnosti přímo na NFC čipu.</div>

  <div class="topbar">
    <div class="topcard"><div class="label">Zůstatek</div><div class="value" id="balance">?</div></div>
    <div class="topcard"><div class="label">UID</div><div class="value" id="viewUid">-</div></div>
    <div class="topcard"><div class="label">Stav</div><div class="value" id="viewStateShort" style="font-size:12px;color:#ddd;font-weight:700;">Čekám na kartu</div></div>
  </div>

  <div class="topactions">
    <button id="startNFC">Zapnout NFC</button>
    <button class="action" onclick="startTopUp()">Dobít</button>
    <button class="action" onclick="startPurchase()">Koupit</button>
    <button class="action" onclick="startVerify()">Ověřit</button>
  </div>

  <div class="main">
    <div class="card">
      <div class="section-title">Prodej</div>

      <div class="field">
        <label for="ticketType">Typ jízdenky</label>
        <select id="ticketType" onchange="onTicketTypeChange()">
          <option value="4">Pásmová jízdenka PID</option>
          <option value="1">Jednorázová jízdenka</option>
          <option value="2">Celodenní jízdenka</option>
          <option value="3">Studentská jízdenka</option>
          <option value="5">Vlastní cena</option>
        </select>
      </div>

      <div id="zoneBlock">
        <div class="compact-grid">
          <div class="field">
            <label for="zoneCount">Pásma</label>
            <select id="zoneCount" onchange="updatePrice()"></select>
          </div>
          <div class="field">
            <label for="zonePrice">Cena pásma</label>
            <input id="zonePrice" type="number" min="1" value="12" oninput="updatePrice()" />
          </div>
        </div>
      </div>

      <div id="customPriceBlock" class="field hidden">
        <label for="customPriceInput">Vlastní cena jízdenky</label>
        <input id="customPriceInput" type="number" min="1" value="25" oninput="updatePrice()" />
      </div>

      <div class="field">
        <label for="ticketValidity">Platnost (min)</label>
        <input id="ticketValidity" type="number" min="1" max="4320" value="60" />
      </div>

      <div class="priceBox">
        Cena jízdenky: <strong id="ticketPrice">0 Kč</strong><br />
        <span id="priceDetail"></span>
      </div>

      <div class="field">
        <label for="amountInput">Částka k dobití</label>
        <div class="amountWrap">
          <input id="amountInput" type="number" inputmode="numeric" placeholder="0" />
          <button class="amountBtn" onclick="clearInput()">C</button>
        </div>
      </div>

      <div id="status" class="info">Stiskněte „Zapnout NFC“.</div>
    </div>

    <div class="card">
      <div class="section-title">Ověření</div>
      <div class="priceBox" style="margin-bottom:8px;">
        Po ověření se zobrazí stav jízdenky a počet pásem.
      </div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
const SECRET_KEY = "demo123";
const MIME_TYPE = "application/x-nfc-terminal";
const FORMAT_VERSION = 1;
const MAX_ZONES = 13;
const FIXED_PRICES = { 1: 25, 2: 80, 3: 15 };
const TICKET_NAMES = { 0: "Žádná", 1: "Jednorázová jízdenka", 2: "Celodenní jízdenka", 3: "Studentská jízdenka", 4: "Pásmová jízdenka PID", 5: "Vlastní cena" };

let ndef = null;
let pendingAction = null;
let amount = 0;
let busy = false;
let card = emptyCard();
let cardLoaded = false;
let cardUid = "-";

function emptyCard() { return { balance: 0, ticketType: 0, zones: 0, validUntilMin: 0, lastKind: 0, lastAmount: 0, lastTicketType: 0, lastZones: 0, lastTimeMin: 0 }; }
function nowMin() { return Math.floor(Date.now() / 60000); }
function minToStr(min) { return min ? new Date(min * 60000).toLocaleString("cs-CZ") : "-"; }
function logMsg(m) { const el = document.getElementById("log"); el.textContent = `[${new Date().toLocaleString("cs-CZ")}] ${m}\n` + el.textContent; }
function setStatus(msg, type = "info") {
  document.getElementById("status").textContent = msg;
  document.getElementById("status").className = type;
  document.getElementById("viewStateShort").textContent = msg;
}

function checksum(bytes) {
  let h = 0x811c9dc5;
  const key = new TextEncoder().encode(SECRET_KEY);
  for (let i = 0; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  for (let i = 0; i < key.length; i++) { h ^= key[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function xorBytes(data) {
  const key = new TextEncoder().encode(SECRET_KEY);
  const out = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) out[i] = data[i] ^ key[i % key.length];
  return out;
}
function encodeCard(c) {
  const buf = new Uint8Array(24);
  const dv = new DataView(buf.buffer);
  dv.setUint8(0, FORMAT_VERSION);
  dv.setUint32(1, c.balance);
  dv.setUint8(5, c.ticketType);
  dv.setUint8(6, c.zones);
  dv.setUint32(7, c.validUntilMin);
  dv.setUint8(11, c.lastKind);
  dv.setUint16(12, c.lastAmount);
  dv.setUint8(14, c.lastTicketType);
  dv.setUint8(15, c.lastZones);
  dv.setUint32(16, c.lastTimeMin);
  dv.setUint32(20, checksum(buf.slice(0, 20)));
  return xorBytes(buf);
}
function decodeCard(bytes) {
  if (bytes.length !== 24) return null;
  const plain = xorBytes(bytes);
  const dv = new DataView(plain.buffer);
  if (dv.getUint8(0) !== FORMAT_VERSION) return null;
  if (dv.getUint32(20) !== checksum(plain.slice(0, 20))) return null;
  return { balance: dv.getUint32(1), ticketType: dv.getUint8(5), zones: dv.getUint8(6), validUntilMin: dv.getUint32(7), lastKind: dv.getUint8(11), lastAmount: dv.getUint16(12), lastTicketType: dv.getUint8(14), lastZones: dv.getUint8(15), lastTimeMin: dv.getUint32(16) };
}

function initZoneSelect() {
  const sel = document.getElementById("zoneCount");
  for (let i = 1; i <= MAX_ZONES; i++) {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = i + (i === 1 ? " pásmo" : i < 5 ? " pásma" : " pásem");
    sel.appendChild(o);
  }
  sel.value = "3";
}
function getTicketPrice() {
  const type = parseInt(document.getElementById("ticketType").value, 10);
  if (type === 4) {
    const zones = parseInt(document.getElementById("zoneCount").value, 10);
    const perZone = parseInt(document.getElementById("zonePrice").value, 10) || 0;
    return { type, zones, price: zones * perZone, perZone };
  }
  if (type === 5) {
    const price = parseInt(document.getElementById("customPriceInput").value, 10) || 0;
    return { type, zones: 0, price, perZone: 0 };
  }
  return { type, zones: 0, price: FIXED_PRICES[type] || 0, perZone: 0 };
}
function onTicketTypeChange() {
  const t = parseInt(document.getElementById("ticketType").value, 10);
  document.getElementById("zoneBlock").classList.toggle("hidden", t !== 4);
  document.getElementById("customPriceBlock").classList.toggle("hidden", t !== 5);
  updatePrice();
}
function updatePrice() {
  const t = getTicketPrice();
  document.getElementById("ticketPrice").textContent = t.price + " Kč";
  document.getElementById("priceDetail").textContent = t.type === 4 ? `${t.zones} × ${t.perZone} Kč za pásmo` : (t.type === 5 ? "Vlastní cena" : TICKET_NAMES[t.type]);
}

async function initNFC() {
  if (!("NDEFReader" in window)) { setStatus("NFC není v tomto prohlížeči podporováno.", "error"); return; }
  ndef = new NDEFReader();
  try {
    await ndef.scan();
    document.getElementById("startNFC").disabled = true;
    setStatus("NFC aktivní — vyberte akci a přiložte kartu.", "info");
    logMsg("NFC zapnuto.");
    ndef.onreading = (e) => handleReading(e);
    ndef.onreadingerror = () => setStatus("Chyba čtení NFC.", "error");
  } catch (err) {
    setStatus("NFC zamítnuto nebo chyba: " + err, "error");
  }
}
async function writeCard() {
  if (!ndef) throw new Error("NFC není inicializované");
  await ndef.write({ records: [{ recordType: "mime", mediaType: MIME_TYPE, data: encodeCard(card) }] });
}
async function handleReading(event) {
  if (busy) return;
  busy = true;
  try {
    cardUid = event.serialNumber || "-";
    let decoded = null;
    for (const record of event.message.records) {
      if (record.recordType === "mime" && record.mediaType === MIME_TYPE) {
        const bytes = new Uint8Array(record.data.buffer, record.data.byteOffset, record.data.byteLength);
        decoded = decodeCard(bytes);
      }
    }
    if (decoded) {
      card = decoded;
    } else {
      card = emptyCard();
      card.lastKind = 3;
      card.lastTimeMin = nowMin();
      await writeCard();
      logMsg("Nová nebo neplatná karta — inicializována na 0 Kč.");
    }
    cardLoaded = true;
    refreshTop();
    if (pendingAction) await runPendingAction();
    else setStatus("Karta načtena.", "success");
  } catch (e) {
    setStatus("Chyba: " + e, "error");
    logMsg("Chyba: " + e);
  } finally {
    busy = false;
  }
}

function refreshTop() {
  document.getElementById("balance").textContent = cardLoaded ? card.balance + " Kč" : "?";
  document.getElementById("viewUid").textContent = cardUid;
}

async function runPendingAction() {
  const action = pendingAction;
  pendingAction = null;
  if (action === "topup") {
    card.balance += amount;
    card.lastKind = 1;
    card.lastAmount = amount;
    card.lastTicketType = 0;
    card.lastZones = 0;
    card.lastTimeMin = nowMin();
    await writeCard();
    setStatus(`Dobito ${amount} Kč.`, "success");
    logMsg(`Dobito ${amount} Kč, kredit ${card.balance} Kč.`);
    clearInput();
  }
  if (action === "buyTicket") {
    const t = getTicketPrice();
    const validity = parseInt(document.getElementById("ticketValidity").value, 10);
    if (!validity || validity <= 0) { setStatus("Zadejte platnost jízdenky.", "error"); return; }
    if (t.price <= 0) { setStatus("Neplatná cena jízdenky.", "error"); return; }
    if (card.balance < t.price) { setStatus(`Nedostatek kreditu (${card.balance} Kč, cena ${t.price} Kč).`, "error"); logMsg("Koupě jízdenky zamítnuta — nedostatek kreditu."); return; }
    card.balance -= t.price;
    card.ticketType = t.type;
    card.zones = t.zones;
    card.validUntilMin = nowMin() + validity;
    card.lastKind = 2;
    card.lastAmount = t.price;
    card.lastTicketType = t.type;
    card.lastZones = t.zones;
    card.lastTimeMin = nowMin();
    await writeCard();
    setStatus(`Prodáno: ${TICKET_NAMES[t.type]}${t.zones ? " (" + t.zones + " p.)" : ""} za ${t.price} Kč.`, "success");
    logMsg(`Prodáno ${TICKET_NAMES[t.type]}${t.zones ? " " + t.zones + " pásem" : ""} za ${t.price} Kč.`);
  }
  if (action === "verify") {
    if (!card.ticketType) {
      setStatus("Na kartě není žádná jízdenka.", "error");
      logMsg("Kontrola: žádná jízdenka.");
    } else {
      const valid = card.validUntilMin * 60000 > Date.now();
      const text = TICKET_NAMES[card.ticketType] + (card.zones ? ` (${card.zones} pásem)` : "");
      if (valid) {
        setStatus(`Platná: ${text} do ${minToStr(card.validUntilMin)}.`, "success");
        logMsg(`Kontrola OK: ${text}, platí do ${minToStr(card.validUntilMin)}.`);
      } else {
        setStatus(`Neplatná: ${text}.`, "error");
        logMsg(`Kontrola: jízdenka vypršela: ${text}.`);
      }
    }
  }
}

function startTopUp() {
  const v = parseInt(document.getElementById("amountInput").value, 10);
  if (!v || v <= 0) { setStatus("Zadejte částku pro dobití.", "error"); return; }
  if (v > 65535) { setStatus("Maximální jednorázové dobití je 65 535 Kč.", "error"); return; }
  pendingAction = "topup";
  amount = v;
  setStatus(`Přiložte kartu — dobití ${v} Kč.`, "info");
}
function startPurchase() {
  pendingAction = "buyTicket";
  const t = getTicketPrice();
  setStatus(`Přiložte kartu — nákup za ${t.price} Kč.`, "info");
}
function startVerify() {
  pendingAction = "verify";
  setStatus("Přiložte kartu k ověření jízdenky.", "info");
}

function clearInput() { document.getElementById("amountInput").value = ""; }

document.getElementById("startNFC").addEventListener("click", initNFC);
initZoneSelect();
onTicketTypeChange();
updatePrice();
refreshTop();
logMsg("Aplikace spuštěna.");
</script>
</body>
</html>
