<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NFC Terminál V2</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --panel2: #151515;
    --blue: #0af;
    --blue2: #06c;
    --text: #fff;
    --muted: #bbb;
    --green: #2ecc71;
    --red: #ff6b6b;
    --border: rgba(0,170,255,0.15);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
  }

  body {
    overflow: hidden;
    padding: 8px;
  }

  .app {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  h1 {
    margin: 0;
    color: var(--blue);
    text-align: center;
    font-size: 24px;
    line-height: 1.1;
  }

  .statusbar {
    padding: 8px 10px;
    border-radius: 12px;
    background: #000;
    border: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.35;
    color: var(--blue);
    min-height: 40px;
  }

  .toprow {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .topcard {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
  }

  .topcard .label { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  .topcard .value {
    font-size: 18px;
    font-weight: 800;
    color: var(--blue);
    line-height: 1.1;
    word-break: break-word;
  }

  .main-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .bigbtn {
    min-height: 84px;
    border: none;
    border-radius: 18px;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    background: var(--blue);
    color: #000;
    box-shadow: 0 0 14px rgba(0,170,255,0.18);
  }

  .bigbtn:active {
    background: var(--blue2);
    transform: scale(0.98);
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    background: var(--bg);
    padding: 10px;
  }

  .overlay.show { display: flex; }

  .panel {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
    flex: 1;
  }

  .panelhead {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    text-align: center;
  }

  .paneltitle {
    font-size: 22px;
    font-weight: 800;
    color: var(--blue);
  }

  .panelsub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
  }

  .field { margin-bottom: 8px; }
  .field:last-child { margin-bottom: 0; }

  .field label {
    display: block;
    color: #aaa;
    margin-bottom: 3px;
    font-size: 11px;
  }

  .field input,
  .field select {
    width: 100%;
    font-size: 17px;
    border: 2px solid var(--blue);
    border-radius: 12px;
    padding: 10px 12px;
    background: #000;
    color: var(--blue);
    outline: none;
    appearance: none;
    min-height: 46px;
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .priceBox {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 13px;
    color: #ddd;
  }
  .priceBox strong { color: var(--green); font-size: 20px; }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: auto;
  }

  .actionbtn {
    min-height: 56px;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    background: var(--blue);
    color: #000;
  }

  .actionbtn.secondary {
    background: #333;
    color: #fff;
  }

  .actionbtn:active {
    background: var(--blue2);
    transform: scale(0.98);
  }

  .actionbtn.secondary:active {
    background: #444;
  }

  .hidden { display: none !important; }

  /* Celá obrazovka pro ověření */
  #verifyOverlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: #fff;
  }
  #verifyOverlay.show { display: flex; }
  #verifyOverlay.ok { background: #0b7a3b; }
  #verifyOverlay.bad { background: #b3261e; }
  #verifyOverlay.none { background: #444; }
  #verifyIcon { font-size: 92px; line-height: 1; }
  #verifyTitle { font-size: 34px; font-weight: 800; margin-top: 8px; }
  #verifyTicket { font-size: 24px; font-weight: 700; margin-top: 10px; }
  #verifyZones { font-size: 52px; font-weight: 800; margin-top: 8px; }
  #verifyValid { font-size: 18px; margin-top: 10px; opacity: .95; }
  #verifyClose {
    margin-top: 20px;
    width: 100%;
    max-width: 340px;
    min-height: 60px;
    border: none;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 800;
    background: #fff;
    color: #000;
  }
</style>
</head>
<body>
<div class="app">
  <h1>NFC Terminál V2</h1>

  <div class="toprow">
    <div class="topcard">
      <div class="label">Zůstatek</div>
      <div class="value" id="balance">?</div>
    </div>
    <div class="topcard">
      <div class="label">UID</div>
      <div class="value" id="uid">-</div>
    </div>
  </div>

  <div class="statusbar" id="status">Připraveno.</div>

  <div class="main-buttons">
    <button class="bigbtn" id="btnNFC">Zapnout NFC</button>
    <button class="bigbtn" onclick="openTopUp()">Dobít</button>
    <button class="bigbtn" onclick="openBuy()">Koupit</button>
    <button class="bigbtn" onclick="openVerify()">Ověřit</button>
  </div>
</div>

<!-- DOBÍT -->
<div class="overlay" id="topupOverlay">
  <div class="panel">
    <div class="panelhead">
      <div class="paneltitle">Dobít kredit</div>
      <div class="panelsub">Zadej částku, pak přilož kartu</div>
    </div>

    <div class="card">
      <div class="field">
        <label for="topupAmount">Částka (Kč)</label>
        <input id="topupAmount" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" oninput="digitsOnly(this)" />
      </div>
    </div>

    <div class="actions">
      <button class="actionbtn secondary" onclick="closeTopUp()">Zavřít</button>
      <button class="actionbtn" onclick="startTopUp()">Pokračovat</button>
    </div>
  </div>
</div>

<!-- KOUPIT -->
<div class="overlay" id="buyOverlay">
  <div class="panel">
    <div class="panelhead">
      <div class="paneltitle">Koupit jízdenku</div>
      <div class="panelsub">Vyber typ a přilož kartu</div>
    </div>

    <div class="card">
      <div class="field">
        <label for="ticketType">Typ jízdenky</label>
        <select id="ticketType" onchange="onTicketTypeChange()">
          <option value="4">Pásmová jízdenka PID</option>
          <option value="1">Jednorázová jízdenka</option>
          <option value="2">Celodenní jízdenka</option>
          <option value="3">Studentská jízdenka</option>
          <option value="5">Vlastní cena</option>
        </select>
      </div>

      <div id="zoneBlock">
        <div class="row2">
          <div class="field">
            <label for="zoneCount">Počet pásem</label>
            <select id="zoneCount" onchange="updatePrice()"></select>
          </div>
          <div class="field">
            <label for="zonePrice">Cena pásma (Kč)</label>
            <input id="zonePrice" type="text" inputmode="numeric" pattern="[0-9]*" value="12" oninput="digitsOnly(this); updatePrice()" />
          </div>
        </div>
      </div>

      <div id="customPriceBlock" class="field hidden">
        <label for="customPriceInput">Vlastní cena jízdenky (Kč)</label>
        <input id="customPriceInput" type="text" inputmode="numeric" pattern="[0-9]*" value="25" oninput="digitsOnly(this); updatePrice()" />
      </div>

      <div class="field">
        <label for="ticketValidity">Platnost (min)</label>
        <input id="ticketValidity" type="text" inputmode="numeric" pattern="[0-9]*" value="60" oninput="digitsOnly(this)" />
      </div>

      <div class="priceBox">
        Cena jízdenky: <strong id="ticketPrice">0 Kč</strong><br>
        <span id="priceDetail"></span>
      </div>
    </div>

    <div class="actions">
      <button class="actionbtn secondary" onclick="closeBuy()">Zavřít</button>
      <button class="actionbtn" onclick="startBuy()">Pokračovat</button>
    </div>
  </div>
</div>

<script>
const SECRET_KEY = "demo123";
const MIME_TYPE = "application/x-nfc-terminal";
const FORMAT_VERSION = 1;
const MAX_ZONES = 13;
const FIXED_PRICES = { 1: 25, 2: 80, 3: 15 };
const TICKET_NAMES = { 0: "Žádná", 1: "Jednorázová jízdenka", 2: "Celodenní jízdenka", 3: "Studentská jízdenka", 4: "Pásmová jízdenka PID", 5: "Vlastní cena" };

let ndef = null;
let pendingAction = null;
let amount = 0;
let busy = false;
let card = emptyCard();
let cardLoaded = false;
let cardUid = "-";

function emptyCard() {
  return { balance: 0, ticketType: 0, zones: 0, validUntilMin: 0, lastKind: 0, lastAmount: 0, lastTicketType: 0, lastZones: 0, lastTimeMin: 0 };
}
function nowMin() { return Math.floor(Date.now() / 60000); }
function minToStr(min) { return min ? new Date(min * 60000).toLocaleString("cs-CZ") : "-"; }
function digitsOnly(el) { el.value = el.value.replace(/\D+/g, ""); }
function numVal(id) { return parseInt(document.getElementById(id).value, 10) || 0; }
function setStatus(msg, type = "info") {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "statusbar " + type;
}

function checksum(bytes) {
  let h = 0x811c9dc5;
  const key = new TextEncoder().encode(SECRET_KEY);
  for (let i = 0; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  for (let i = 0; i < key.length; i++) { h ^= key[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function xorBytes(data) {
  const key = new TextEncoder().encode(SECRET_KEY);
  const out = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) out[i] = data[i] ^ key[i % key.length];
  return out;
}
function encodeCard(c) {
  const buf = new Uint8Array(24);
  const dv = new DataView(buf.buffer);
  dv.setUint8(0, FORMAT_VERSION);
  dv.setUint32(1, c.balance);
  dv.setUint8(5, c.ticketType);
  dv.setUint8(6, c.zones);
  dv.setUint32(7, c.validUntilMin);
  dv.setUint8(11, c.lastKind);
  dv.setUint16(12, c.lastAmount);
  dv.setUint8(14, c.lastTicketType);
  dv.setUint8(15, c.lastZones);
  dv.setUint32(16, c.lastTimeMin);
  dv.setUint32(20, checksum(buf.slice(0, 20)));
  return xorBytes(buf);
}
function decodeCard(bytes) {
  if (bytes.length !== 24) return null;
  const plain = xorBytes(bytes);
  const dv = new DataView(plain.buffer);
  if (dv.getUint8(0) !== FORMAT_VERSION) return null;
  if (dv.getUint32(20) !== checksum(plain.slice(0, 20))) return null;
  return {
    balance: dv.getUint32(1),
    ticketType: dv.getUint8(5),
    zones: dv.getUint8(6),
    validUntilMin: dv.getUint32(7),
    lastKind: dv.getUint8(11),
    lastAmount: dv.getUint16(12),
    lastTicketType: dv.getUint8(14),
    lastZones: dv.getUint8(15),
    lastTimeMin: dv.getUint32(16)
  };
}

function initZoneSelect() {
  const sel = document.getElementById("zoneCount");
  for (let i = 1; i <= MAX_ZONES; i++) {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = i + (i === 1 ? " pásmo" : i < 5 ? " pásma" : " pásem");
    sel.appendChild(o);
  }
  sel.value = "3";
}
function getTicketPrice() {
  const type = parseInt(document.getElementById("ticketType").value, 10);
  if (type === 4) {
    const zones = numVal("zoneCount");
    const perZone = numVal("zonePrice");
    return { type, zones, price: zones * perZone, perZone };
  }
  if (type === 5) return { type, zones: 0, price: numVal("customPriceInput"), perZone: 0 };
  return { type, zones: 0, price: FIXED_PRICES[type] || 0, perZone: 0 };
}
function onTicketTypeChange() {
  const t = parseInt(document.getElementById("ticketType").value, 10);
  document.getElementById("zoneBlock").classList.toggle("hidden", t !== 4);
  document.getElementById("customPriceBlock").classList.toggle("hidden", t !== 5);
  updatePrice();
}
function updatePrice() {
  const t = getTicketPrice();
  document.getElementById("ticketPrice").textContent = t.price + " Kč";
  document.getElementById("priceDetail").textContent = t.type === 4 ? `(${t.zones} × ${t.perZone} Kč)` : "";
}
function refreshTop() {
  document.getElementById("balance").textContent = cardLoaded ? card.balance + " Kč" : "?";
  document.getElementById("uid").textContent = cardUid;
}

function openTopUp() { document.getElementById("topupOverlay").classList.add("show"); setStatus("Zadejte částku.", "info"); }
function closeTopUp() { document.getElementById("topupOverlay").classList.remove("show"); setStatus("Připraveno.", "info"); }
function openBuy() { document.getElementById("buyOverlay").classList.add("show"); onTicketTypeChange(); setStatus("Vyberte jízdenku.", "info"); }
function closeBuy() { document.getElementById("buyOverlay").classList.remove("show"); setStatus("Připraveno.", "info"); }

function showVerify(kind, icon, title, ticket, zones, valid) {
  const ov = document.getElementById("verifyOverlay");
  ov.className = "show " + kind;
  document.getElementById("verifyIcon").textContent = icon;
  document.getElementById("verifyTitle").textContent = title;
  document.getElementById("verifyTicket").textContent = ticket;
  document.getElementById("verifyZones").textContent = zones;
  document.getElementById("verifyValid").textContent = valid;
}
function closeVerify() {
  document.getElementById("verifyOverlay").className = "";
  setStatus("Připraveno.", "info");
}

async function initNFC() {
  if (!("NDEFReader" in window)) { setStatus("NFC není podporováno v tomto prohlížeči.", "error"); return; }
  try {
    ndef = new NDEFReader();
    await ndef.scan();
    document.getElementById("btnNFC").disabled = true;
    setStatus("NFC aktivní — vyberte akci a přiložte kartu.", "info");
    ndef.onreading = (e) => handleReading(e);
    ndef.onreadingerror = () => setStatus("Chyba čtení NFC.", "error");
  } catch (err) {
    setStatus("NFC zamítnuto nebo chyba: " + err, "error");
  }
}
async function writeCard() {
  if (!ndef) throw new Error("NFC není zapnuté");
  await ndef.write({ records: [{ recordType: "mime", mediaType: MIME_TYPE, data: encodeCard(card) }] });
}
async function handleReading(event) {
  if (busy) return;
  busy = true;
  try {
    cardUid = event.serialNumber || "-";
    let decoded = null;
    for (const record of event.message.records) {
      if (record.recordType === "mime" && record.mediaType === MIME_TYPE) {
        const bytes = new Uint8Array(record.data.buffer, record.data.byteOffset, record.data.byteLength);
        decoded = decodeCard(bytes);
      }
    }
    if (decoded) card = decoded;
    else {
      card = emptyCard();
      card.lastKind = 3;
      card.lastTimeMin = nowMin();
      await writeCard();
    }
    cardLoaded = true;
    refreshTop();
    if (pendingAction) await runPendingAction();
    else setStatus("Karta načtena.", "success");
  } catch (e) {
    setStatus("Chyba: " + e, "error");
  } finally {
    busy = false;
  }
}

async function runPendingAction() {
  const action = pendingAction;
  pendingAction = null;

  if (action === "topup") {
    card.balance += amount;
    card.lastKind = 1;
    card.lastAmount = amount;
    card.lastTicketType = 0;
    card.lastZones = 0;
    card.lastTimeMin = nowMin();
    await writeCard();
    setStatus(`Dobito ${amount} Kč.`, "success");
    closeTopUp();
    document.getElementById("topupAmount").value = "";
    return;
  }

  if (action === "buyTicket") {
    const t = getTicketPrice();
    const validity = numVal("ticketValidity");
    if (!validity) { setStatus("Zadejte platnost jízdenky.", "error"); return; }
    if (t.price <= 0) { setStatus("Neplatná cena jízdenky.", "error"); return; }
    if (card.balance < t.price) { setStatus(`Nedostatek kreditu (${card.balance} Kč, cena ${t.price} Kč).`, "error"); return; }

    card.balance -= t.price;
    card.ticketType = t.type;
    card.zones = t.zones;
    card.validUntilMin = nowMin() + validity;
    card.lastKind = 2;
    card.lastAmount = t.price;
    card.lastTicketType = t.type;
    card.lastZones = t.zones;
    card.lastTimeMin = nowMin();
    await writeCard();
    setStatus(`Prodáno za ${t.price} Kč.`, "success");
    closeBuy();
    return;
  }

  if (action === "verify") {
    if (!card.ticketType) {
      showVerify("none", "✖", "Žádná jízdenka", "Na kartě není jízdenka", "", "");
      return;
    }
    const valid = card.validUntilMin * 60000 > Date.now();
    const zones = card.zones ? `${card.zones} ${card.zones === 1 ? "pásmo" : card.zones < 5 ? "pásma" : "pásem"}` : "";
    const ticket = TICKET_NAMES[card.ticketType];
    if (valid) {
      showVerify("ok", "✔", "PLATNÁ", ticket, zones, "Platí do " + minToStr(card.validUntilMin));
    } else {
      showVerify("bad", "✖", "NEPLATNÁ", ticket, zones, "Vypršela " + minToStr(card.validUntilMin));
    }
  }
  refreshTop();
}

function startTopUp() {
  const v = numVal("topupAmount");
  if (!v) { setStatus("Zadejte částku.", "error"); return; }
  if (v > 65535) { setStatus("Maximální jednorázové dobití je 65 535 Kč.", "error"); return; }
  pendingAction = "topup";
  amount = v;
  setStatus(`Přiložte kartu — dobití ${v} Kč.`, "info");
}
function startBuy() {
  pendingAction = "buyTicket";
  const t = getTicketPrice();
  setStatus(`Přiložte kartu — nákup za ${t.price} Kč.`, "info");
}
function startVerify() {
  pendingAction = "verify";
  closeTopUp();
  closeBuy();
  setStatus("Přiložte kartu k ověření.", "info");
}

document.getElementById("btnNFC").addEventListener("click", initNFC);
initZoneSelect();
onTicketTypeChange();
refreshTop();
</script>

<div id="verifyOverlay" class="">
  <div id="verifyIcon"></div>
  <div id="verifyTitle"></div>
  <div id="verifyTicket"></div>
  <div id="verifyZones"></div>
  <div id="verifyValid"></div>
  <button id="verifyClose" onclick="closeVerify()">Zavřít</button>
</div>
</body>
</html>
